<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정부기금유치 사업공고 대시보드</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --blue-900: #1e3a5f;
            --blue-700: #2563eb;
            --blue-500: #5b8def;
            --blue-100: #eaf2ff;
            --blue-050: #f6f9ff;

            --text-main: #22324a;
            --text-sub: #7f8ca3;

            --line: #dde6f2;
            --white: #ffffff;
        }

        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text-main);

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #f8fbff 45%,
                    #f3f7fd 100%
                );

            min-height: 100vh;
        }

        .page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 28px 70px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 9px;
            font-size: 34px;
            font-weight: 760;
            letter-spacing: -1px;
            color: var(--blue-900);
        }

        .header p {
            margin: 0;
            font-size: 15px;
            color: var(--text-sub);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 26px;
        }

        .summary-card {
            position: relative;
            overflow: hidden;

            padding: 24px;

            background: var(--white);

            border: 1px solid var(--line);
            border-radius: 18px;

            box-shadow:
                0 10px 28px rgba(37, 99, 235, 0.07);

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease;
        }

        .summary-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 16px 34px rgba(37, 99, 235, 0.11);
        }

        /* 선택된 요약 카드 */
        .summary-card.active {
            background: #eef4ff;
            border-color: #8eb5ff;

            box-shadow:
                0 8px 22px rgba(37, 99, 235, 0.10);
        }

        .summary-card.active .label {
            color: #2563eb;
        }

        .summary-card.active .number {
            color: #2563eb;
        }

        .summary-card .label {
            margin-bottom: 10px;

            font-size: 14px;
            font-weight: 650;

            color: #71809a;
        }

        .summary-card .number {
            font-size: 34px;
            font-weight: 780;

            color: var(--blue-900);
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 26px;
        }

        .search-box,
        .select-box {
            border: 1px solid var(--line);

            background: rgba(255,255,255,0.96);

            border-radius: 12px;

            padding: 13px 15px;

            font-size: 14px;
            color: var(--text-main);

            box-shadow:
                0 5px 16px rgba(34, 50, 74, 0.04);

            outline: none;
        }

        .search-box {
            flex: 1;
        }

        .board {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: start;
        }

        .column {
            min-height: 520px;
            padding: 18px;
            border-radius: 20px;
            border: 1px solid var(--line);

            box-shadow:
                0 10px 30px rgba(34, 50, 74, 0.05);
        }

        .open-column {
            background:
                linear-gradient(
                    180deg,
                    #f4f8ff,
                    #eef5ff
                );
        }

        .closed-column {
            background:
                linear-gradient(
                    180deg,
                    #fbfcfe,
                    #f5f7fb
                );
        }

        .column-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 4px 3px;
        }

        .column-name {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .column-title h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 740;
            color: var(--blue-900);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .status-dot.open {
            background: var(--blue-700);
            box-shadow:
                0 0 0 4px rgba(37, 99, 235, 0.10);
        }

        .status-dot.closed {
            background: #9aa7b8;
            box-shadow:
                0 0 0 4px rgba(154, 167, 184, 0.10);
        }

        .count {
            padding: 6px 10px;
            border-radius: 20px;
            background: var(--white);
            border: 1px solid var(--line);
            font-size: 12px;
            font-weight: 650;
            color: #6f7d92;
        }

        .notice-card {
            position: relative;
            margin-bottom: 15px;
            padding: 20px;

            background:
                rgba(255, 255, 255, 0.96);

            border:
                1px solid rgba(213, 224, 238, 0.95);

            border-radius: 15px;

            box-shadow:
                0 8px 20px rgba(34, 50, 74, 0.055);

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease;
        }

        .notice-card:hover {
            transform: translateY(-4px);

            border-color:
                rgba(91, 141, 239, 0.40);

            box-shadow:
                0 14px 28px rgba(37, 99, 235, 0.10);
        }

        .status {
            display: inline-block;
            margin-bottom: 13px;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status.open {
            color: #245cc9;
            background: #e7f0ff;
            border: 1px solid #c9dcff;
        }

        .status.closed {
            color: #738096;
            background: #f1f4f8;
            border: 1px solid #dfe5ec;
        }

        .notice-card h3 {
            margin: 0 0 15px;
            font-size: 17px;
            font-weight: 710;
            line-height: 1.5;
            color: #23334c;
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #7a879a;
        }

        .meta-label {
            color: #53657d;
            font-weight: 650;
        }

        .tag {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 9px;
            border-radius: 8px;
            background: var(--blue-100);
            color: #526c94;
            border: 1px solid #d8e5f8;
            font-size: 12px;
            font-weight: 600;
        }

        .detail-link {
            display: inline-flex;
            align-items: center;
            margin-top: 17px;
            color: var(--blue-700);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .empty-message {
            padding: 18px;
            color: #8a96a8;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .page {
                padding: 30px 18px 50px;
            }

            .header h1 {
                font-size: 27px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .board {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
            }
        }

            .favorite-btn {
            position: absolute;
            top: 24px;
            right: 24px;

            background: none;
            border: none;
            padding: 0;

            font-size: 18px;
            line-height: 1;
            cursor: pointer;

            color: #9ca3af;
        }

        .favorite-btn:hover {
            transform: scale(1.1);
        }

        .favorite-btn.active {
            color: #f5b800;
        }

        .update-info {
            margin-top: 24px;
            margin-bottom: 14px;

            font-size: 15px;
            font-weight: 400;
            color: var(--text-sub);
        }

    </style>
</head>

<body>

    <div class="page">

        <header class="header">
            <h1>정부기금유치 사업공고 대시보드</h1>
            <p>지원사업의 모집 현황을 한눈에 확인하세요.</p>
        </header>

        <section class="summary">

            <div class="summary-card total" data-view="all">
                <div class="label">전체 공고</div>
                <div class="number" id="totalCount">0</div>
            </div>

            <div class="summary-card open" data-view="open">
                <div class="label">모집중</div>
                <div class="number" id="openCount">0</div>
            </div>

            <div class="summary-card closed" data-view="favorites">
                <div class="label">즐겨찾기</div>
                <div class="number" id="favoriteCount">0</div>
            </div>

        </section>

        <div class="update-info">
            최종 업데이트 · <span id="updatedAt">확인 중...</span>
        </div>

        <section class="toolbar">

            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="공고명을 검색하세요"
            >

            <select id="categoryFilter" class="select-box">
                <option value="all">전체 분야</option>
                <option value="온라인 판로">온라인 판로</option>
                <option value="마케팅">마케팅</option>
                <option value="교육">교육</option>
                <option value="컨설팅">컨설팅</option>
            </select>

        </section>

        <main class="board">

            <section class="column open-column">

                <div class="column-title">

                    <div class="column-name">
                        <span class="status-dot open"></span>
                        <h2>모집중</h2>
                    </div>

                    <span class="count" id="openColumnCount">
                        0건
                    </span>

                </div>

                <div id="openList"></div>

            </section>

            

        </main>

    </div>


    <script>


        let notices = [];
        let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
        let currentView = "all";


function getStatus(item) {

    if (
        item.apply_possible === "Y"
        &&
        item.deadline_yn !== "Y"
    ) {
        return "open";
    }

    return "closed";
}

function openOriginal(sourceId) {

    const form = document.createElement("form");

    form.method = "POST";
    form.action =
        "https://fanfandaero.kr/portal/v2/preSprtBizPbancDetail.do";

    form.target = "_blank";


    const sprtBizCd =
        document.createElement("input");

    sprtBizCd.type = "hidden";
    sprtBizCd.name = "sprtBizCd";
    sprtBizCd.value = sourceId;


    const sprtBizTrgtYn =
        document.createElement("input");

    sprtBizTrgtYn.type = "hidden";
    sprtBizTrgtYn.name = "sprtBizTrgtYn";
    sprtBizTrgtYn.value = "Y";


    const groupNo =
        document.createElement("input");

    groupNo.type = "hidden";
    groupNo.name = "groupNo";
    groupNo.value = "";


    form.appendChild(sprtBizCd);
    form.appendChild(sprtBizTrgtYn);
    form.appendChild(groupNo);

    document.body.appendChild(form);

    form.submit();

    form.remove();
}

async function loadNotices() {

    try {

        const response = await fetch(
            "data.json",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                `data.json 불러오기 실패: ${response.status}`
            );
        }


        const data = await response.json();


        const items = Array.isArray(data) ? data : data.items;
        const updatedAt = Array.isArray(data) ? "" : (data.updated_at || "");

        document.getElementById("updatedAt").textContent =
         updatedAt || "업데이트 정보 없음";

        notices = items.map(item => {

            return {
                title: item.title,
                status: getStatus(item),

                period:
                    `${item.apply_start} ~ ${item.apply_end}`,

                target:
                    item.target || "정보 없음",

                category:
                    item.category || "기타",

                region:
                    item.region || "전국",

                source:
                    item.source || "판판대로",

                sourceId:
                    item.source_id

            };

        });

updateSummary();
renderNotices();

        console.log(
            `공고 ${notices.length}건을 불러왔습니다.`
        );

    }

    catch (error) {

        console.error(error);

        document
            .getElementById("openList")
            .innerHTML =
            `<div class="empty-message">
                데이터를 불러오지 못했습니다.
            </div>`;

    }
}


        function createNoticeCard(notice) {

            const statusText =
                notice.status === "open"
                ? "모집중"
                : "모집완료";

            return `
                <article class="notice-card">

                    <span class="status ${notice.status}">
                        ${statusText}
                    </span>

                    <h3>
                        ${notice.title}
                        <button
                            class="favorite-btn ${favorites.includes(notice.sourceId) ? "active" : ""}"
                            onclick="toggleFavorite('${notice.sourceId}')"
                            title="즐겨찾기"
                        >
                            ${favorites.includes(notice.sourceId) ? "★" : "☆"}
                        </button>
                    </h3>

                    <div class="meta">

                        <span class="meta-label">
                            모집기간
                        </span>

                        <span>
                            ${notice.period}
                        </span>

                    </div>

                    <div class="meta">

                        <span class="meta-label">
                            지원대상
                        </span>

                        <span>
                            ${notice.target}
                        </span>

                    </div>

                    <span class="tag">
                        ${notice.category}
                    </span>

                    <br>

                    <a
                        href="#"
                        class="detail-link"
                        onclick="openOriginal('${notice.sourceId}'); return false;"
                    >
                        원문보기 →
                    </a>

                </article>
            `;
        }

        function toggleFavorite(sourceId) {
            if (favorites.includes(sourceId)) {
                favorites = favorites.filter(id => id !== sourceId);
            } else {
                favorites.push(sourceId);
            }

            localStorage.setItem(
                "favorites",
                JSON.stringify(favorites)
            );

            updateSummary();
            renderNotices();
        }


        function renderNotices() {

            const searchValue =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase();

            const categoryValue =
                document
                    .getElementById("categoryFilter")
                    .value;


            const filteredNotices =
                notices.filter(notice => {

                    const matchesSearch =
                        notice.title
                            .toLowerCase()
                            .includes(searchValue);

                    const matchesCategory =
                        categoryValue === "all"
                        || notice.category === categoryValue;

                    const matchesView =
                        currentView === "all"
                        || (currentView === "open" && notice.status === "open")
                        || (currentView === "favorites" && favorites.includes(notice.sourceId));

                    return matchesSearch && matchesCategory && matchesView;
                });


            const openNotices =
                filteredNotices.filter(
                    notice => notice.status === "open"
                );

            const openList =
                document.getElementById("openList");


            if (openNotices.length > 0) {

                openList.innerHTML =
                    openNotices
                        .map(createNoticeCard)
                        .join("");

            } else {

                openList.innerHTML =
                    `<div class="empty-message">
                        해당하는 모집중 공고가 없습니다.
                    </div>`;
            }


            document
                .getElementById("openColumnCount")
                .textContent =
                `${openNotices.length}건`;

        }


        function updateSummary() {

            const openCount =
                notices.filter(
                    notice => notice.status === "open"
                ).length;

            const favoriteCount =
                notices.filter(
                    notice => favorites.includes(notice.sourceId)
                ).length;

            document
                .getElementById("totalCount")
                .textContent =
                notices.length;


            document
                .getElementById("openCount")
                .textContent =
                openCount;

            document
                .getElementById("favoriteCount")
                .textContent =
                favoriteCount;

        }


        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                renderNotices
            );


        document
            .getElementById("categoryFilter")
            .addEventListener(
                "change",
                renderNotices
            );
        
        document
            .querySelectorAll(".summary-card")
            .forEach(card => {
                card.addEventListener("click", () => {
                    currentView = card.dataset.view;

                    document
                        .querySelectorAll(".summary-card")
                        .forEach(item => {
                            item.classList.remove("active");
                        });

                    card.classList.add("active");

                    renderNotices();
                });
            });


        loadNotices();


    </script>

</body>
</html>
