name: Update Business Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests truststore python-dotenv tzdata

      - name: Update data
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          G2B_ENDPOINT: ${{ secrets.G2B_ENDPOINT }}
        run: python update_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json g2b_data.json

          if [ -f fanfandaero_data.json ]; then
            git add fanfandaero_data.json
          fi

          git diff --cached --quiet || git commit -m "Auto update business notice data"
          git push